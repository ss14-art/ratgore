- type: vessel
  id: Sasha
  name: ЛРНП Саша
  description: |
    Коммунарский линейный крейсер.
    Вооружение: 4x 50мм, 2x 60мм, 4x 90мм, 2x 240мм.
    Минимальный экипаж: 1x Пилот, 1x Стрелок, 4x Заряжающий.
  price: 250000
  category: Large
  group: None
  path: /Maps/_Crescent/Shuttles/NCWL/sasha.yml

- type: gameMap
  id: Sasha
  mapName: 'ЛРНП Саша'
  mapPath: /Maps/_Crescent/Shuttles/NCWL/sasha.yml
  minPlayers: 0
  stations:
    Sasha:
      stationProto: StandardCrescentVessel
      gridComponents:
        - type: MapIcon
          iconType: Shuttle
      components:
      - type: StationNameSetup
        mapNameTemplate: 'ЛРНП Саша {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: VesselDesignation
        designation: vessel-designation-warship
      - type: VesselDescription
        description: Модифицированный реликт прошлого.
      - type: VesselIcon
        iffIcon:
          sprite: _Crescent/ShipIcons/ifficons.rsi
          state: cruiser
